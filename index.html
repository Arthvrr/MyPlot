<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot — Graphiques Modernes</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --primary: #09090b;
            --primary-fg: #ffffff;
            --bg: #f5f5f7;
            --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #f5f5f7 100%);
            --card: #ffffff;
            --card-subtle: #fafafa;
            --card-hover: #f4f4f5;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.16);
            --input-bg: #fafafa;
            --input-focus-bg: #ffffff;
            --input-focus-ring: rgba(0, 0, 0, 0.06);
            --add-bg: #f5f5f7;
            --add-border: #d2d2d7;
            --add-hover: #e8e8ed;
            --danger-bg: #fff0f0;
            --danger-hover: #ffe5e5;
            --danger-fg: #ef4444;
            --badge-bg: rgba(255, 255, 255, 0.88);
            --checker-a: #f4f4f5;
            --checker-b: #e4e4e7;
            --series-shadow: drop-shadow(0 6px 8px rgba(15, 23, 42, 0.18));
            --shadow-card: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-btn: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-primary: 0 8px 16px rgba(0, 0, 0, 0.15);
            --shadow-menu: 0 18px 40px -8px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.06);
            --radius-lg: 24px;
            --radius-md: 12px;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --primary: #fafafa;
            --primary-fg: #09090b;
            --bg: #09090b;
            --bg-gradient: radial-gradient(circle at 50% 0%, #17171c 0%, #09090b 100%);
            --card: #121216;
            --card-subtle: #18181d;
            --card-hover: #1e1e24;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.2);
            --input-bg: #18181d;
            --input-focus-bg: #1f1f26;
            --input-focus-ring: rgba(255, 255, 255, 0.08);
            --add-bg: #18181d;
            --add-border: rgba(255, 255, 255, 0.16);
            --add-hover: #222229;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --danger-hover: rgba(239, 68, 68, 0.22);
            --danger-fg: #f87171;
            --badge-bg: rgba(24, 24, 29, 0.88);
            --checker-a: #18181d;
            --checker-b: #24242c;
            --series-shadow: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55));
            --shadow-card: 0 24px 60px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            --shadow-btn: 0 4px 14px rgba(0, 0, 0, 0.45);
            --shadow-primary: 0 8px 20px rgba(0, 0, 0, 0.5);
            --shadow-menu: 0 22px 50px -8px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* --- Top-bar : Repli + Plot à gauche, Toggle Dark Mode à droite du panel --- */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 420px;
            padding: 1.5rem 2rem 1rem 1.5rem;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: linear-gradient(to bottom, var(--card) 75%, transparent);
            pointer-events: none;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.25s ease;
        }

        .top-bar > * { pointer-events: auto; }

        body.sidebar-collapsed .top-bar {
            width: auto;
            background: transparent;
            gap: 16px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-toggle-sidebar,
        .btn-theme-toggle {
            background: var(--card);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-toggle-sidebar:hover,
        .btn-theme-toggle:hover {
            background: var(--card-hover);
            border-color: var(--border-strong);
            transform: scale(1.05);
        }

        .btn-toggle-sidebar svg,
        .btn-theme-toggle svg { width: 18px; height: 18px; }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-brand svg { width: 22px; height: 22px; color: var(--text-main); }
        .app-brand span {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-main);
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 420px;
            flex-shrink: 0;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            padding-top: 5rem;
            overflow-y: auto;
            z-index: 10;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.25s ease, border-color 0.25s ease;
        }
        .sidebar.hidden { margin-left: -420px; }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.4rem 0 0.8rem 0;
            gap: 8px;
        }
        .section-header:first-child { margin-top: 0.4rem; }

        .section-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 0;
        }

        .section-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-text-subtle {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 7px;
            border-radius: 7px;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
        }
        .btn-text-subtle:hover {
            color: var(--text-main);
            background: var(--card-hover);
            border-color: var(--border);
        }
        .btn-text-subtle.active {
            color: var(--primary-fg);
            background: var(--primary);
        }
        .btn-text-subtle svg { width: 13px; height: 13px; }

        .input-group { margin-bottom: 0.95rem; }
        label {
            display: block;
            font-size: 0.83rem;
            font-weight: 500;
            margin-bottom: 0.45rem;
            color: var(--text-main);
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.68rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            background: var(--input-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        select:focus, input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--border-strong);
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 3px var(--input-focus-ring);
        }

        /* Formats (Ratios prédéfinis) */
        .ratios-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 0.35rem;
        }

        .ratio-chip {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 7px 4px;
            cursor: pointer;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
            transition: all 0.18s ease;
        }
        .ratio-chip:hover {
            background: var(--card-hover);
            color: var(--text-main);
            border-color: var(--border-strong);
        }
        .ratio-chip.active {
            background: var(--primary);
            color: var(--primary-fg);
            border-color: var(--primary);
        }

        /* Palettes harmonisées */
        .palettes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 0.5rem;
        }

        .palette-chip {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            transition: all 0.18s ease;
            color: var(--text-main);
        }
        .palette-chip:hover {
            background: var(--card-hover);
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }
        .palette-chip.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--input-focus-ring);
            background: var(--card-hover);
        }
        .palette-swatches {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .palette-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(128, 128, 128, 0.2);
        }
        .palette-name {
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Toggles */
        .toggles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 10px;
            margin-bottom: 0.35rem;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.82rem;
            padding: 0.34rem 0;
            margin-bottom: 0;
            color: var(--text-main);
        }
        .toggle-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Séries */
        .series-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 0.5rem;
        }

        .series-row {
            display: grid;
            grid-template-columns: 34px 1fr 34px;
            gap: 8px;
            align-items: center;
        }
        .series-row.single-series {
            grid-template-columns: 34px 1fr;
        }

        .circular-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--card-subtle);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.7rem;
            margin-bottom: 0.65rem;
            display: none;
        }

        /* Lignes de données */
        .data-row {
            display: grid;
            grid-template-columns: 34px 1fr 86px 26px 34px;
            gap: 7px;
            margin-bottom: 8px;
            align-items: center;
        }
        .data-row.no-row-color {
            grid-template-columns: 1fr 86px 26px 34px;
        }
        .data-row.multi-series-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--card-subtle);
            margin-bottom: 10px;
        }
        .data-row-top {
            display: grid;
            grid-template-columns: 1fr 26px 34px;
            gap: 7px;
            align-items: center;
            width: 100%;
        }
        .data-row-values {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            width: 100%;
        }
        .series-val-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .series-val-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .series-val-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .series-val-field input[type="number"] {
            padding: 0.5rem 0.65rem;
            font-size: 0.84rem;
        }

        .data-row.hidden-row { opacity: 0.45; filter: grayscale(0.5); }

        input[type="color"] {
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: var(--input-bg);
            flex-shrink: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
        input[type="color"]::-webkit-color-swatch { border-radius: 5px; border: none; }

        .hide-checkbox {
            width: 17px;
            height: 17px;
            cursor: pointer;
            justify-self: center;
            accent-color: var(--primary);
        }

        .btn-add {
            background: var(--add-bg);
            border: 1px dashed var(--add-border);
            padding: 0.68rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-top: 0.35rem;
            transition: all 0.2s;
        }
        .btn-add:hover { background: var(--add-hover); }

        .btn-remove {
            background: var(--danger-bg);
            color: var(--danger-fg);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-remove:hover { background: var(--danger-hover); }

        /* --- Main --- */
        .main-content {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4.5rem 2.5rem 2.5rem 2.5rem;
            position: relative;
            background: var(--bg-gradient);
            transition: background 0.25s ease;
            overflow: hidden;
        }

        /* Stage wrapper : affiche le damier de transparence sans qu'il soit capturé par html2canvas */
        .export-stage {
            width: 100%;
            max-width: 900px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--card);
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .export-stage.checkerboard {
            background-color: var(--checker-a);
            background-image:
                linear-gradient(45deg, var(--checker-b) 25%, transparent 25%),
                linear-gradient(-45deg, var(--checker-b) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--checker-b) 75%),
                linear-gradient(-45deg, transparent 75%, var(--checker-b) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .export-container {
            background: var(--card);
            padding: 2.5rem 2.5rem 3.4rem 2.5rem;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            transition: background-color 0.25s ease;
        }

        .export-container.is-transparent {
            background: transparent;
        }

        /* Ombre CSS sur les séries : évite le bug SVG <filter> de Safari en plein écran */
        #captureArea.has-shadows .apexcharts-series {
            filter: var(--series-shadow);
        }

        .export-title {
            text-align: center;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 1.25rem;
            display: none;
            flex-shrink: 0;
        }

        /* Badge moyenne pour les graphiques circulaires / radar */
        .avg-badge {
            display: none;
            align-self: center;
            margin-bottom: 0.75rem;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
            background: rgba(14, 165, 233, 0.14);
            color: #0284c7;
            border: 1px solid rgba(14, 165, 233, 0.3);
            flex-shrink: 0;
        }
        [data-theme="dark"] .avg-badge {
            background: rgba(56, 189, 248, 0.16);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.32);
        }

        #mainChart {
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* Source (bas à gauche, en symétrie exacte avec Made with Plot) */
        .chart-source {
            position: absolute;
            bottom: 14px;
            left: 16px;
            display: none;
            align-items: center;
            height: 26px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            max-width: calc(100% - 175px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 30;
            user-select: none;
        }

        /* Badge Made With Plot (bas à droite) */
        .made-with-plot {
            position: absolute;
            bottom: 14px;
            right: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 26px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--badge-bg);
            padding: 0 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-btn);
            pointer-events: none;
            z-index: 30;
            text-transform: uppercase;
            user-select: none;
        }
        .made-with-plot svg {
            width: 12px;
            height: 12px;
            stroke: var(--text-main);
            fill: none;
        }
        .made-with-plot span { color: var(--text-muted); }
        .made-with-plot b { color: var(--text-main); }

        /* Actions & Dropdown Export */
        .actions {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 60;
        }

        .export-dropdown {
            position: relative;
        }

        .export-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 235px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px;
            box-shadow: var(--shadow-menu);
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
        }
        .export-menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .export-menu-item {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 9px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: left;
            color: var(--text-main);
            transition: background 0.15s ease;
        }
        .export-menu-item:hover { background: var(--card-hover); }
        .export-menu-item svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
        .export-menu-item:hover svg { color: var(--text-main); }
        .export-menu-text { display: flex; flex-direction: column; gap: 1px; }
        .export-menu-title { font-size: 0.83rem; font-weight: 600; color: var(--text-main); }
        .export-menu-sub { font-size: 0.7rem; color: var(--text-muted); }

        .export-menu-divider {
            height: 1px;
            background: var(--border);
            margin: 5px 6px;
        }

        .btn-download {
            background: var(--primary);
            color: var(--primary-fg);
            border: none;
            padding: 0 1.15rem 0 1.25rem;
            height: 40px;
            border-radius: 100px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: var(--shadow-primary);
        }
        .btn-download:hover { transform: translateY(-2px); opacity: 0.92; }
        .btn-download:disabled { opacity: 0.65; cursor: wait; transform: none; }
        .btn-download svg { width: 16px; height: 16px; }

        .btn-secondary {
            background: var(--card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0 1rem;
            height: 40px;
            border-radius: 100px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-btn);
        }
        .btn-secondary:hover {
            background: var(--card-hover);
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }
        .btn-secondary:disabled { opacity: 0.65; cursor: wait; transform: none; }
        .btn-secondary svg { width: 15px; height: 15px; }

        .btn-icon {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-btn);
        }
        .btn-icon:hover {
            background: var(--card-hover);
            transform: scale(1.05);
            border-color: var(--border-strong);
        }
        .btn-icon svg { width: 18px; height: 18px; }
        .btn-icon.fullscreen-active {
            background: var(--primary);
            color: var(--primary-fg);
            border-color: var(--primary);
        }

        /* Bouton de sortie plein écran */
        .btn-exit-fullscreen {
            display: none;
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 40;
        }

        /* Plein écran : >= 90% largeur et hauteur disponibles */
        #captureArea::backdrop { background: var(--card); }

        #captureArea.is-fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0;
            box-shadow: none;
            border: none;
            padding: 2vh 3vw 3.25rem 3vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card) !important;
            z-index: 1000;
            overflow: hidden;
        }

        #captureArea.is-fullscreen .btn-exit-fullscreen { display: flex; }
        #captureArea.is-fullscreen .export-title { margin-bottom: 1rem; flex-shrink: 0; }
        #captureArea.is-fullscreen #mainChart { width: 100%; flex: 1; min-height: 0; }
        #captureArea.is-fullscreen .made-with-plot { bottom: 1.15rem; right: 1.5rem; }
        #captureArea.is-fullscreen .chart-source { bottom: 1.15rem; left: 1.5rem; }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 1.75rem;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--primary);
            color: var(--primary-fg);
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: #ef4444;
            color: #ffffff;
        }

        /* ApexCharts Tooltip polish en mode sombre */
        [data-theme="dark"] .apexcharts-tooltip {
            background: #18181d !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6) !important;
        }
        [data-theme="dark"] .apexcharts-tooltip-title {
            background: #121216 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Masquer/Afficher le menu">
                <i data-lucide="panel-left"></i>

                <i data-lucide="bar-chart-2"></i>
                <span>Plot</span>
            </div>
        </div>

            <i data-lucide="moon"></i>
        </button>

    <aside class="sidebar" id="sidebar">
        <div class="section-header">
            <div class="section-title">Personnalisation</div>

            </button>
        </div>

        <div class="input-group">
            <label for="chartTitle">Titre du graphique</label>

        </div>

        <div class="input-group">
            <label for="chartSource">Source (bas à gauche)</label>

        <div class="input-group">

            <select id="chartType" onchange="onChartTypeChange()">
                <optgroup label="Comparaison & Évolution">

        <div class="input-group">

        <div class="toggles-grid">

        <div class="section-header">

        <div class="palettes-grid" id="palettesGrid"></div>

        <div class="section-header">
            <div class="section-title">Séries (Légende)</div>
        </div>
        <div id="circularHint" class="circular-hint">Ce graphique affiche la première série et utilise la couleur de chaque donnée.</div>
        <div id="seriesList" class="series-list"></div>
        <button class="btn-add" id="addSeriesBtn" onclick="addSeries()">+ Ajouter une série</button>

        <div class="section-header">

            <div class="section-actions">
                <button type="button" class="btn-text-subtle" id="sortAscBtn" onclick="sortRows('asc')" title="Trier par ordre croissant">
                    <i data-lucide="arrow-up-narrow-wide"></i> Croissant

                <button type="button" class="btn-text-subtle" id="sortDescBtn" onclick="sortRows('desc')" title="Trier par ordre décroissant">

        <div class="export-stage" id="exportStage">

                <div id="displaySource" class="chart-source"></div>

                </div>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const STORAGE_KEY = 'plot-state-v2';

        const VALID_CHART_TYPES = [
            'bar', 'bar-horizontal', 'line', 'step', 'area',
            'scatter', 'radar', 'donut', 'pie', 'polarArea', 'radialBar'
        ];

        const CIRCULAR_TYPES = ['donut', 'pie', 'polarArea', 'radialBar'];
        const TRENDLINE_TYPES = ['bar', 'line', 'step', 'area', 'scatter'];

        const ASPECT_RATIOS = [
            { id: 'auto', label: 'Auto', ratio: null },
            { id: '16:9', label: '16:9', ratio: 16 / 9 },
            { id: '4:3',  label: '4:3',  ratio: 4 / 3 },
            { id: '1:1',  label: '1:1',  ratio: 1 },
            { id: '4:5',  label: '4:5',  ratio: 4 / 5 },
            { id: '9:16', label: '9:16', ratio: 9 / 16 }
        ];

        const PALETTES = [
            {
                id: 'nordic',
                name: 'Nordic',
                light: ['#18181b', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                dark:  ['#f4f4f5', '#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa']
            },
            {
                id: 'ocean',
                name: 'Océan',
                light: ['#2563eb', '#0ea5e9', '#06b6d4', '#6366f1', '#38bdf8', '#1d4ed8'],
                dark:  ['#3b82f6', '#38bdf8', '#22d3ee', '#818cf8', '#60a5fa', '#2563eb']
            },
            {
                id: 'emerald',
                name: 'Émeraude',
                light: ['#10b981', '#059669', '#14b8a6', '#34d399', '#0d9488', '#047857'],
                dark:  ['#34d399', '#10b981', '#2dd4bf', '#6ee7b7', '#14b8a6', '#059669']
            },
            {
                id: 'solar',
                name: 'Solaire',
                light: ['#f59e0b', '#f97316', '#ef4444', '#eab308', '#fb7185', '#d97706'],
                dark:  ['#fbbf24', '#fb923c', '#f87171', '#facc15', '#fda4af', '#f59e0b']
            },
            {
                id: 'iris',
                name: 'Iris',
                light: ['#8b5cf6', '#a855f7', '#ec4899', '#6366f1', '#c084fc', '#f43f5e'],
                dark:  ['#a78bfa', '#c084fc', '#f472b6', '#818cf8', '#d8b4fe', '#fb7185']
            },
            {
                id: 'mono',
                name: 'Mono',
                light: ['#18181b', '#52525b', '#71717a', '#a1a1aa', '#3f3f46', '#d4d4d8'],
                dark:  ['#fafafa', '#d4d4d8', '#a1a1aa', '#71717a', '#e4e4e7', '#52525b']
            }
        ];

        let chart = null;
        let currentChartSignature = null;
        let isDarkMode = false;
        let toastTimer = null;
        let resizeRenderTimer = null;
        let lastSortDir = null;

        function getFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        function isCircularType(type) {
            return CIRCULAR_TYPES.includes(type);
        }

        function getPaletteColors(paletteId, dark = isDarkMode) {
            const p = PALETTES.find(item => item.id === paletteId) || PALETTES[0];
            return dark ? p.dark : p.light;
        }

        function createDefaultState(dark = false) {
            const cols = getPaletteColors('nordic', dark);
            return {
                title: '',
                source: '',
                chartType: 'bar',
                aspectRatio: 'auto',
                showLegend: true,
                showLabels: false,
                showTrendline: false,
                showAverage: false,
                showShadows: false,
                transparentBg: false,
                stacked: false,
                activePalette: 'nordic',
                series: [
                    { name: 'Valeur', color: cols[0] }
                ],
                rows: [
                    { label: 'Q1', values: [120.5], color: cols[0], hidden: false },
                    { label: 'Q2', values: [180.0], color: cols[1], hidden: false },
                    { label: 'Q3', values: [250.75], color: cols[2], hidden: false },
                    { label: 'Q4', values: [310.2], color: cols[3], hidden: false }
                ]
            };
        }

        let state = createDefaultState(false);

        /* --- Toast --- */
        function showToast(message, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.className = 'toast' + (isError ? ' error' : '');
            requestAnimationFrame(() => el.classList.add('visible'));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('visible'), 2400);
        }

        /* --- Encodage / Décodage URL sans backend --- */
        function encodeStateToHash(st) {
            const compact = {
                v: 3,
                dk: isDarkMode ? 1 : 0,
                t: st.title,
                so: st.source,
                ct: st.chartType,
                ar: st.aspectRatio || 'auto',
                l: st.showLegend ? 1 : 0,
                dl: st.showLabels ? 1 : 0,
                trd: st.showTrendline ? 1 : 0,
                avg: st.showAverage ? 1 : 0,
                sh: st.showShadows ? 1 : 0,
                tr: st.transparentBg ? 1 : 0,
                st: st.stacked ? 1 : 0,
                p: st.activePalette || '',
                s: st.series.map(s => [s.name, s.color]),
                r: st.rows.map(r => [r.label, r.values, r.color, r.hidden ? 1 : 0])
            };
            const bytes = new TextEncoder().encode(JSON.stringify(compact));
            let binary = '';
            bytes.forEach(byte => { binary += String.fromCharCode(byte); });
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function decodeStateFromHash(hashStr) {
            let base64 = hashStr.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            const binary = atob(base64);
            const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
            const data = JSON.parse(new TextDecoder().decode(bytes));
            if (!data || !Array.isArray(data.s) || !Array.isArray(data.r) || data.s.length === 0) {
                throw new Error('Format invalide');
            }
            const validRatio = ASPECT_RATIOS.some(a => a.id === data.ar) ? data.ar : 'auto';
            return {
                dark: typeof data.dk === 'number' ? data.dk === 1 : null,
                state: {
                    title: String(data.t || ''),
                    source: String(data.so || ''),
                    chartType: VALID_CHART_TYPES.includes(data.ct) ? data.ct : 'bar',
                    aspectRatio: validRatio,
                    showLegend: Boolean(data.l),
                    showLabels: Boolean(data.dl),
                    showTrendline: Boolean(data.trd),
                    showAverage: Boolean(data.avg),
                    showShadows: Boolean(data.sh),
                    transparentBg: Boolean(data.tr),
                    stacked: Boolean(data.st),
                    activePalette: data.p || '',
                    series: data.s.map(item => ({
                        name: String(item[0] || 'Série'),
                        color: String(item[1] || '#3b82f6')
                    })),
                    rows: data.r.map(item => ({
                        label: String(item[0] || ''),
                        values: Array.isArray(item[1]) ? item[1].map(n => Number(n) || 0) : [0],
                        color: String(item[2] || '#3b82f6'),
                        hidden: Boolean(item[3])
                    }))
                }
            };
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Sauvegarde localStorage impossible', e);
            }
        }

        function loadInitialState() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#data=')) {
                try {
                    const decoded = decodeStateFromHash(hash.slice(6));
                    if (decoded.dark !== null) applyTheme(decoded.dark, false);
                    state = decoded.state;
                    normalizeRowsValues();
                    saveStateToStorage();
                    setTimeout(() => showToast('Graphique chargé depuis le lien partagé'), 250);
                    return;
                } catch (err) {
                    console.warn('Lien partagé invalide:', err);
                }
            }

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Array.isArray(parsed.series) && parsed.series.length > 0 && Array.isArray(parsed.rows)) {
                        state = { ...createDefaultState(isDarkMode), ...parsed };
                        if (!VALID_CHART_TYPES.includes(state.chartType)) state.chartType = 'bar';
                        if (!ASPECT_RATIOS.some(a => a.id === state.aspectRatio)) state.aspectRatio = 'auto';
                        normalizeRowsValues();
                        return;
                    }
                }
            } catch (err) {
                console.warn('Lecture localStorage impossible:', err);
            }

            state = createDefaultState(isDarkMode);
        }

        function normalizeRowsValues() {
            const count = state.series.length;
            state.rows.forEach(row => {
                if (!Array.isArray(row.values)) row.values = [0];
                while (row.values.length < count) row.values.push(0);
                if (row.values.length > count) row.values = row.values.slice(0, count);
            });
        }

        function resetToDefault() {
            state = createDefaultState(isDarkMode);
            lastSortDir = null;
            updateSortButtonsUI();
            if (window.location.hash.startsWith('#data=')) {
                history.replaceState(null, '', window.location.pathname + window.location.search);
            }
            syncControlsFromState();
            renderRatios();
            renderPalettes();
            renderSeriesList();
            renderDataList();
            applyAspectRatioLayout();
            updateUI(true);
            showToast('Graphique réinitialisé');
        }

        /* --- Thème --- */
        function initTheme() {
            const saved = localStorage.getItem('plot-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved ? saved === 'dark' : prefersDark, false);
        }

        function applyTheme(dark, shouldUpdateChart = true) {
            isDarkMode = dark;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            localStorage.setItem('plot-theme', dark ? 'dark' : 'light');

            const themeBtn = document.getElementById('themeToggleBtn');
            themeBtn.innerHTML = `<i data-lucide="${dark ? 'sun' : 'moon'}"></i>`;
            themeBtn.title = dark ? 'Passer en mode clair' : 'Passer en mode sombre';

            if (shouldUpdateChart && state.activePalette) {
                const cols = getPaletteColors(state.activePalette, dark);
                state.series.forEach((s, i) => { s.color = cols[i % cols.length]; });
                state.rows.forEach((r, i) => { r.color = cols[i % cols.length]; });
                renderPalettes();
                renderSeriesList();
                renderDataList();
            }

            lucide.createIcons();
            if (shouldUpdateChart && chart) updateUI(true);
        }

        function toggleTheme() {
            applyTheme(!isDarkMode, true);
        }

        /* --- Sidebar & Contrôles --- */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            document.body.classList.toggle('sidebar-collapsed', sidebar.classList.contains('hidden'));
            scheduleCleanRerender(320);
        }

        function syncControlsFromState() {
            document.getElementById('chartTitle').value = state.title;
            document.getElementById('chartSource').value = state.source;
            document.getElementById('chartType').value = state.chartType;
            document.getElementById('showLegend').checked = state.showLegend;
            document.getElementById('showLabels').checked = state.showLabels;
            document.getElementById('showTrendline').checked = state.showTrendline;
            document.getElementById('showAverage').checked = state.showAverage;
            document.getElementById('showShadows').checked = state.showShadows;
            document.getElementById('transparentBg').checked = state.transparentBg;
            document.getElementById('stackedMode').checked = state.stacked;
        }

        function onMetaInput() {
            state.title = document.getElementById('chartTitle').value;
            state.source = document.getElementById('chartSource').value;
            updateHeaderAndFooterDOM();
            if (state.aspectRatio !== 'auto' || getFullscreenElement()) {
                applyAspectRatioLayout();
                scheduleCleanRerender(80);
            } else {
                saveStateToStorage();
            }
        }

        function onToggleChange(source) {
            state.showLegend = document.getElementById('showLegend').checked;
            state.showLabels = document.getElementById('showLabels').checked;
            state.showTrendline = document.getElementById('showTrendline').checked;
            state.showAverage = document.getElementById('showAverage').checked;
            state.showShadows = document.getElementById('showShadows').checked;
            state.transparentBg = document.getElementById('transparentBg').checked;
            state.stacked = document.getElementById('stackedMode').checked;

            // Évite le conflit ApexCharts entre mode empilé multi-séries et série mixte de tendance
            if (source === 'trendline' && state.showTrendline && state.stacked && state.series.length > 1) {
                state.stacked = false;
                document.getElementById('stackedMode').checked = false;
                showToast('Mode empilé désactivé pour afficher la courbe de tendance');
            } else if (source === 'stacked' && state.stacked && state.showTrendline && state.series.length > 1) {
                state.showTrendline = false;
                document.getElementById('showTrendline').checked = false;
                showToast('Courbe de tendance désactivée en mode empilé');
            }

            if (source === 'trendline' && state.showTrendline && !TRENDLINE_TYPES.includes(state.chartType)) {
                showToast('La courbe de tendance s’affiche sur Barres, Courbe, Escalier, Zone et Nuage');
            }

            const needsRecreate = (source === 'trendline' || source === 'stacked' || source === 'average');
            updateUI(needsRecreate);
        }

        function onChartTypeChange() {
            state.chartType = document.getElementById('chartType').value;
            renderSeriesList();
            renderDataList();
            updateUI(true);
        }

        /* --- Formats prédéfinis (Aspect Ratio) --- */
        function renderRatios() {
            const grid = document.getElementById('ratiosGrid');
            grid.innerHTML = '';
            ASPECT_RATIOS.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'ratio-chip' + (state.aspectRatio === item.id ? ' active' : '');
                btn.textContent = item.label;
                btn.onclick = () => selectAspectRatio(item.id);
                grid.appendChild(btn);
            });
        }

        function selectAspectRatio(ratioId) {
            state.aspectRatio = ratioId;
            renderRatios();
            applyAspectRatioLayout();
            saveStateToStorage();
            renderChart(false);
        }

        function applyAspectRatioLayout() {
            const stage = document.getElementById('exportStage');
            const mainEl = document.getElementById('mainContent');

            if (getFullscreenElement()) {
                stage.style.width = '';
                stage.style.height = '';
                stage.style.maxWidth = '';
                return;
            }

            const ratioDef = ASPECT_RATIOS.find(r => r.id === state.aspectRatio);
            if (!ratioDef || !ratioDef.ratio) {
                stage.style.width = '100%';
                stage.style.height = 'auto';
                stage.style.maxWidth = '900px';
                return;
            }

            const availW = Math.max(300, Math.min(920, mainEl.clientWidth - 80));
            const availH = Math.max(320, mainEl.clientHeight - 120);

            let boxW = availW;
            let boxH = boxW / ratioDef.ratio;
            if (boxH > availH) {
                boxH = availH;
                boxW = boxH * ratioDef.ratio;
            }

            stage.style.maxWidth = 'none';
            stage.style.width = Math.round(boxW) + 'px';
            stage.style.height = Math.round(boxH) + 'px';
        }

        /* --- Palettes harmonisées --- */
        function renderPalettes() {
            const grid = document.getElementById('palettesGrid');
            grid.innerHTML = '';

                const cols = isDarkMode ? palette.dark : palette.light;

                btn.type = 'button';
                btn.className = 'palette-chip' + (state.activePalette === palette.id ? ' active' : '');
                btn.onclick = () => applyPalette(palette.id);

                const swatches = cols.slice(0, 4)
                    .map(c => `<span class="palette-dot" style="background:${c}"></span>`)
                    .join('');
                btn.innerHTML = `
                    <div class="palette-swatches">${swatches}</div>
                    <span class="palette-name">${palette.name}</span>

                grid.appendChild(btn);

        function applyPalette(paletteId) {
            state.activePalette = paletteId;
            const cols = getPaletteColors(paletteId, isDarkMode);
            state.series.forEach((s, i) => { s.color = cols[i % cols.length]; });
            state.rows.forEach((r, i) => { r.color = cols[i % cols.length]; });

            renderSeriesList();
            renderDataList();

        /* --- Tri des données (Croissant / Décroissant) --- */
        function updateSortButtonsUI() {
            document.getElementById('sortAscBtn').classList.toggle('active', lastSortDir === 'asc');
            document.getElementById('sortDescBtn').classList.toggle('active', lastSortDir === 'desc');
        }

        function sortRows(direction) {
            const mult = direction === 'asc' ? 1 : -1;
            const useSum = !isCircularType(state.chartType) && state.series.length > 1 && state.stacked;

            state.rows.sort((a, b) => {
                const va = useSum
                    ? a.values.reduce((acc, n) => acc + (Number(n) || 0), 0)
                    : (Number(a.values[0]) || 0);
                const vb = useSum
                    ? b.values.reduce((acc, n) => acc + (Number(n) || 0), 0)
                    : (Number(b.values[0]) || 0);
                return (va - vb) * mult;
            });

            lastSortDir = direction;
            updateSortButtonsUI();
            renderDataList();
            updateUI(false);
            showToast(direction === 'asc' ? 'Données triées par ordre croissant' : 'Données triées par ordre décroissant');
        }
