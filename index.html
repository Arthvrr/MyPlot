        /* --- Calculs statistiques : Régression linéaire & Moyenne --- */
        function computeLinearTrend(ys) {
            const n = ys.length;
            if (n < 2) return ys.slice();
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            for (let i = 0; i < n; i++) {
                sumX += i;
                sumY += ys[i];
                sumXY += i * ys[i];
                sumXX += i * i;
            }
            const denom = n * sumXX - sumX * sumX;
            if (denom === 0) return ys.slice();
            const slope = (n * sumXY - sumX * sumY) / denom;
            const intercept = (sumY - slope * sumX) / n;
            return ys.map((_, i) => Number((intercept + slope * i).toFixed(2)));
        }

        function computeAverage(visibleRows) {
            if (!visibleRows.length) return null;
            const isCirc = isCircularType(state.chartType);
            if (isCirc || state.series.length === 1) {
                const nums = visibleRows.map(r => Number(r.values[0]) || 0);
                return nums.reduce((a, b) => a + b, 0) / nums.length;
            }
            if (state.stacked && (state.chartType === 'bar' || state.chartType === 'bar-horizontal' || state.chartType === 'area')) {
                const totals = visibleRows.map(r => r.values.reduce((acc, n) => acc + (Number(n) || 0), 0));
                return totals.reduce((a, b) => a + b, 0) / totals.length;
            }
            const all = [];
            visibleRows.forEach(r => {
                for (let i = 0; i < state.series.length; i++) {
                    all.push(Number(r.values[i]) || 0);
                }
            });
            return all.length ? all.reduce((a, b) => a + b, 0) / all.length : null;
        }

        /* --- Hauteur dynamique (Plein écran, Ratio fixe, ou Auto) --- */
        function getChartHeight() {
            const titleEl = document.getElementById('displayTitle');
            const avgEl = document.getElementById('avgBadge');
            const hasTitle = titleEl && titleEl.style.display !== 'none' && titleEl.textContent.trim() !== '';
            const hasAvgBadge = avgEl && avgEl.style.display !== 'none';
            const titleHeight = hasTitle ? (titleEl.offsetHeight + 20) : 0;
            const avgHeight = hasAvgBadge ? (avgEl.offsetHeight + 12) : 0;

            if (getFullscreenElement()) {
                const verticalChrome = (window.innerHeight * 0.02) + 52;
                return Math.max(320, Math.floor(window.innerHeight - verticalChrome - titleHeight - avgHeight));
            }

            if (state.aspectRatio !== 'auto') {
                const stage = document.getElementById('exportStage');
                const stageH = stage.clientHeight || 480;
                const containerPadding = 94; // 2.5rem haut + 3.4rem bas
                return Math.max(200, Math.floor(stageH - containerPadding - titleHeight - avgHeight));
            }

            return 420;
        }

        /* --- Construction des options ApexCharts --- */
        function buildChartOptions(animate = true) {
            const visibleRows = state.rows.filter(r => !r.hidden && r.label.trim() !== '');
            const labels = visibleRows.map(r => r.label);
            const rowColors = visibleRows.map(r => r.color);
            const type = state.chartType;

            const isCirc = isCircularType(type);
            const isHorizontalBar = (type === 'bar-horizontal');
            const isVerticalBar = (type === 'bar');
            const isBar = isVerticalBar || isHorizontalBar;
            const isLine = (type === 'line' || type === 'step');
            const isArea = (type === 'area');
            const isScatter = (type === 'scatter');
            const isRadar = (type === 'radar');
            const isRadialBar = (type === 'radialBar');
            const isMultiSeries = !isCirc && state.series.length > 1;
            const isSingleSeriesBar = isBar && state.series.length === 1;

            const canStack = state.stacked && isMultiSeries && (isBar || isArea);
            const canTrendline = state.showTrendline && TRENDLINE_TYPES.includes(type) && !canStack && visibleRows.length >= 2;
            const avgValue = state.showAverage ? computeAverage(visibleRows) : null;

            const seriesColors = state.series.map(s => s.color);
            const trendColor = isDarkMode ? '#fb7185' : '#e11d48';
            const avgColor = isDarkMode ? '#38bdf8' : '#0284c7';
            const textColor = isDarkMode ? '#a1a1aa' : '#52525b';
            const strongTextColor = isDarkMode ? '#f4f4f5' : '#18181b';
            const cardBg = isDarkMode ? '#121216' : '#ffffff';
            const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.08)' : '#f1f5f9';

            const formatDecimals = val => {
                const num = Number(val);
                return Number.isFinite(num) ? num.toFixed(2) : '0.00';
            };

            // Type interne ApexCharts
            let apexChartType = type;
            if (isHorizontalBar) apexChartType = 'bar';
            if (type === 'step') apexChartType = 'line';
            if (canTrendline) apexChartType = 'line'; // Mode mixte propre pour combiner bar/area/scatter + trendline

            // Valeurs radialBar normalisées sur 0-100 tout en affichant les vraies valeurs
            const rawRadialValues = visibleRows.map(r => Math.max(0, Number(r.values[0]) || 0));
            const maxRadialVal = Math.max(...rawRadialValues, 0);
            const radialScaleMax = maxRadialVal > 100 ? maxRadialVal * 1.12 : 100;

            // Construction des séries
            let apexSeries;
            if (isRadialBar) {
                apexSeries = rawRadialValues.map(v => Number(((v / radialScaleMax) * 100).toFixed(1)));
            } else if (isCirc) {
                apexSeries = visibleRows.map(r => Number(r.values[0]) || 0);
            } else if (isSingleSeriesBar) {
                apexSeries = [{
                    name: state.series[0].name || 'Valeur',
                    ...(canTrendline ? { type: 'column' } : {}),
                    data: visibleRows.map(r => ({
                        x: r.label,
                        y: Number(r.values[0]) || 0,
                        fillColor: r.color
                    }))
                }];
            } else {
                const mixedSeriesType = isVerticalBar ? 'column' : (isArea ? 'area' : (isScatter ? 'scatter' : 'line'));
                apexSeries = state.series.map((s, sIdx) => ({
                    name: s.name || `Série ${sIdx + 1}`,
                    ...(canTrendline ? { type: mixedSeriesType } : {}),
                    data: visibleRows.map(r => Number(r.values[sIdx]) || 0)
                }));
            }

            // Ajout de la courbe de tendance (régression linéaire)
            if (canTrendline) {
                const baseYs = visibleRows.map(r => {
                    if (state.series.length === 1) return Number(r.values[0]) || 0;
                    const sum = r.values.reduce((acc, v) => acc + (Number(v) || 0), 0);
                    return sum / state.series.length;
                });
                const trendYs = computeLinearTrend(baseYs);
                apexSeries.push({
                    name: 'Tendance',
                    type: 'line',
                    data: isSingleSeriesBar
                        ? visibleRows.map((r, idx) => ({ x: r.label, y: trendYs[idx] }))
                        : trendYs
                });
            }

            const dataSeriesCount = isCirc ? 0 : state.series.length;
            const colorsList = isCirc
                ? rowColors
                : (canTrendline ? [...seriesColors, trendColor] : seriesColors);

            // Stroke configuration
            let strokeOptions;
            if (canTrendline) {
                const dataWidth = (isVerticalBar || isScatter) ? 0 : 3;
                const dataCurve = type === 'step' ? 'stepline' : 'smooth';
                strokeOptions = {
                    show: true,
                    width: [...Array(dataSeriesCount).fill(dataWidth), 2.5],
                    dashArray: [...Array(dataSeriesCount).fill(0), 6],
                    curve: [...Array(dataSeriesCount).fill(dataCurve), 'straight'],
                    lineCap: 'round',
                    colors: colorsList
                };
            } else if (isLine || isArea) {
                strokeOptions = {
                    show: true,
                    curve: type === 'step' ? 'stepline' : 'smooth',
                    width: 3,
                    lineCap: 'round',
                    colors: seriesColors
                };
            } else if (isRadar) {
                strokeOptions = {
                    show: true,
                    width: 2.5,
                    colors: seriesColors
                };
            } else if (isScatter) {
                strokeOptions = { show: false, width: 0 };
            } else if (isCirc) {
                strokeOptions = { show: false, width: 0 };
            } else {
                strokeOptions = { show: false, width: 0 };
            }

            // Fill configuration
            let fillOptions;
            if (isArea && canTrendline) {
                fillOptions = {
                    type: [...Array(dataSeriesCount).fill('gradient'), 'solid'],
                    opacity: [...Array(dataSeriesCount).fill(1), 1],
                    gradient: {
                        shadeIntensity: 1,
                        opacityFrom: isDarkMode ? 0.32 : 0.26,
                        opacityTo: 0.02,
                        stops: [0, 95, 100]
                    }
                };
            } else if (isArea) {
                fillOptions = {
                    type: 'gradient',
                    gradient: {
                        shadeIntensity: 1,
                        opacityFrom: isDarkMode ? 0.32 : 0.26,
                        opacityTo: 0.02,
                        stops: [0, 95, 100]
                    }
                };
            } else if (isRadar) {
                fillOptions = { opacity: isDarkMode ? 0.28 : 0.2 };
            } else if (type === 'polarArea') {
                fillOptions = { opacity: 0.88 };
            } else {
                fillOptions = { type: 'solid', opacity: 1 };
            }

            // Markers configuration
            let markersOptions;
            if (canTrendline) {
                const dataSize = isVerticalBar ? 0 : (isScatter ? 7 : 5);
                markersOptions = {
                    size: [...Array(dataSeriesCount).fill(dataSize), 0],
                    strokeWidth: 2,
                    strokeColors: cardBg,
                    hover: { sizeOffset: 2 }
                };
            } else if (isScatter) {
                markersOptions = {
                    size: 7,
                    strokeWidth: 2,
                    strokeColors: cardBg,
                    hover: { size: 9 }
                };
            } else if (isLine || isArea || isRadar) {
                markersOptions = {
                    size: 5,
                    strokeWidth: 2,
                    strokeColors: cardBg,
                    hover: { size: 7 }
                };
            } else {
                markersOptions = { size: 0 };
            }

            // Annotations pour la ligne de moyenne (cartésien vertical & horizontal)
            const annotations = { yaxis: [], xaxis: [] };
            if (avgValue !== null && !isCirc && !isRadar) {
                const avgConfig = {
                    borderColor: avgColor,
                    strokeDashArray: 5,
                    borderWidth: 2,
                    label: {
                        borderColor: avgColor,
                        style: {
                            color: '#ffffff',
                            background: avgColor,
                            fontSize: '11px',
                            fontWeight: 700,
                            fontFamily: 'Inter, sans-serif',
                            padding: { left: 8, right: 8, top: 3, bottom: 3 }
                        },
                        text: `Moyenne : ${formatDecimals(avgValue)}`
                    }
                };
                if (isHorizontalBar) {
                    annotations.xaxis.push({
                        x: avgValue,
                        ...avgConfig,
                        label: { ...avgConfig.label, orientation: 'horizontal', offsetY: -6 }
                    });
                } else {
                    annotations.yaxis.push({
                        y: avgValue,
                        ...avgConfig,
                        label: { ...avgConfig.label, position: 'right', offsetX: -8, offsetY: -4 }
                    });
                }
            }

            // Axes X / Y (inversion propre pour les barres horizontales)
            const xaxisOptions = isHorizontalBar
                ? {
                    axisBorder: { color: gridColor },
                    axisTicks: { color: gridColor },
                    labels: {
                        formatter: formatDecimals,
                        style: { colors: textColor, fontSize: '12px' }
                    }
                }
                : (isSingleSeriesBar
                    ? {
                        type: 'category',
                        axisBorder: { color: gridColor },
                        axisTicks: { color: gridColor },
                        labels: { style: { colors: textColor, fontSize: '12px' } }
                    }
                    : {
                        categories: labels,
                        axisBorder: { color: gridColor },
                        axisTicks: { color: gridColor },
                        labels: { style: { colors: textColor, fontSize: '12px' } }
                    });

            const yaxisOptions = isHorizontalBar
                ? {
                    labels: { style: { colors: textColor, fontSize: '12px' } }
                }
                : {
                    labels: {
                        formatter: formatDecimals,
                        style: { colors: textColor, fontSize: '12px' }
                    }
                };

            // DataLabels (ne pas encombrer la courbe de tendance)
            const enabledOnSeries = canTrendline
                ? Array.from({ length: dataSeriesCount }, (_, i) => i)
                : undefined;

            return {
                chart: {
                    type: apexChartType,
                    width: '100%',
                    height: getChartHeight(),
                    stacked: canStack,
                    background: 'transparent',
                    foreColor: textColor,
                    toolbar: { show: false },
                    zoom: { enabled: false },
                    fontFamily: 'Inter, sans-serif',
                    animations: { enabled: animate, speed: 350 },
                    dropShadow: { enabled: false }
                },
                theme: { mode: isDarkMode ? 'dark' : 'light' },
                colors: colorsList,
                labels: labels,
                series: apexSeries,
                stroke: strokeOptions,
                fill: fillOptions,
                markers: markersOptions,
                annotations: annotations,
                grid: {
                    borderColor: gridColor,
                    strokeDashArray: 4,
                    padding: { top: 10, right: 16, bottom: 10, left: 10 }
                },
                xaxis: xaxisOptions,
                yaxis: yaxisOptions,
                tooltip: {
                    theme: isDarkMode ? 'dark' : 'light',
                    shared: (isMultiSeries || canTrendline) && !isCirc && !isScatter && !isRadar,
                    intersect: isScatter,
                    y: {
                        formatter: isRadialBar
                            ? (_, opts) => formatDecimals(rawRadialValues[opts.seriesIndex] ?? 0)
                            : formatDecimals
                    }
                },
                legend: {
                    show: state.showLegend,
                    showForSingleSeries: true,
                    position: 'bottom',
                    fontSize: '13px',
                    fontFamily: 'Inter, sans-serif',
                    offsetY: 6,
                    labels: { colors: strongTextColor }
                },
                dataLabels: {
                    enabled: state.showLabels,
                    enabledOnSeries: enabledOnSeries,
                    formatter: (val, opts) => {
                        if (type === 'donut' || type === 'pie') return Number(val).toFixed(1) + '%';
                        if (isRadialBar) return formatDecimals(rawRadialValues[opts.seriesIndex] ?? 0);
                        return formatDecimals(val);
                    },
                    offsetX: isHorizontalBar && !canStack ? 26 : 0,
                    offsetY: (isLine || isArea || isScatter) ? -10 : (isVerticalBar && !canStack ? -20 : 0),
                    style: {
                        fontSize: '12px',
                        fontFamily: 'Inter, sans-serif',
                        fontWeight: 600,
                        colors: (isCirc || canStack) ? ['#ffffff'] : [strongTextColor]
                    },
                    background: { enabled: false },
                    dropShadow: { enabled: false }
                },
                plotOptions: {
                    bar: {
                        horizontal: isHorizontalBar,
                        borderRadius: canStack ? 3 : 6,
                        columnWidth: isMultiSeries ? '60%' : '45%',
                        barHeight: isMultiSeries ? '66%' : '52%',
                        dataLabels: { position: canStack ? 'center' : 'top' },
                        distributed: false
                    },
                    pie: {
                        donut: {
                            size: '70%',
                            labels: {
                                show: type === 'donut',
                                name: { show: true, color: textColor, fontSize: '13px' },
                                value: {
                                    show: true,
                                    color: strongTextColor,
                                    fontSize: '20px',
                                    fontWeight: 700,
                                    formatter: formatDecimals
                                },
                                total: {
                                    show: true,
                                    label: state.series[0]?.name || 'Total',
                                    color: textColor,
                                    fontSize: '13px',
                                    fontWeight: 600,
                                    formatter: (w) => {
                                        const sum = w.globals.seriesTotals.reduce((a, b) => a + b, 0);
                                        return formatDecimals(sum);
                                    }
                                }
                            }
                        }
                    },
                    polarArea: {
                        rings: { strokeWidth: 1, strokeColor: gridColor },
                        spokes: { strokeWidth: 1, connectorColors: gridColor }
                    },
                    radar: {
                        polygons: {
                            strokeColors: gridColor,
                            connectorColors: gridColor,
                            fill: { colors: ['transparent'] }
                        }
                    },
                    radialBar: {
                        hollow: { size: '32%' },
                        track: {
                            background: isDarkMode ? 'rgba(255,255,255,0.08)' : '#f1f5f9',
                            strokeWidth: '100%'
                        },
                        dataLabels: {
                            name: { show: true, fontSize: '13px', color: textColor },
                            value: {
                                show: true,
                                fontSize: '18px',
                                fontWeight: 700,
                                color: strongTextColor,
                                formatter: (pct) => {
                                    const approx = (Number(pct) / 100) * radialScaleMax;
                                    return formatDecimals(approx);
                                }
                            },
                            total: {
                                show: true,
                                label: state.series[0]?.name || 'Total',
                                color: textColor,
                                fontSize: '13px',
                                fontWeight: 600,
                                formatter: () => formatDecimals(rawRadialValues.reduce((a, b) => a + b, 0))
                            }
                        }
                    }
                }
            };
        }

        function updateHeaderAndFooterDOM() {
            const displayTitle = document.getElementById('displayTitle');
            if (state.title.trim() !== '') {
                displayTitle.textContent = state.title;
                displayTitle.style.display = 'block';
            } else {
                displayTitle.textContent = '';
                displayTitle.style.display = 'none';
            }

            const displaySource = document.getElementById('displaySource');
            if (state.source.trim() !== '') {
                displaySource.textContent = state.source;
                displaySource.style.display = 'inline-flex';
            } else {
                displaySource.textContent = '';
                displaySource.style.display = 'none';
            }

            // Badge moyenne pour les graphiques sans axe cartésien (circulaires & radar)
            const avgBadge = document.getElementById('avgBadge');
            const showNonCartesianAvg = state.showAverage && (isCircularType(state.chartType) || state.chartType === 'radar');
            if (showNonCartesianAvg) {
                const visibleRows = state.rows.filter(r => !r.hidden && r.label.trim() !== '');
                const avg = computeAverage(visibleRows);
                if (avg !== null) {
                    avgBadge.textContent = `Moyenne : ${avg.toFixed(2)}`;
                    avgBadge.style.display = 'inline-flex';
                } else {
                    avgBadge.style.display = 'none';
                }
            } else {
                avgBadge.style.display = 'none';
            }

            const stage = document.getElementById('exportStage');
            const captureArea = document.getElementById('captureArea');
            stage.classList.toggle('checkerboard', state.transparentBg);
            captureArea.classList.toggle('is-transparent', state.transparentBg);
            captureArea.classList.toggle('has-shadows', state.showShadows);
        }

        function getChartSignature() {
            return `${state.chartType}|${state.showTrendline}|${state.stacked}|${state.series.length}`;
        }

        function renderChart(animate = true) {
            updateHeaderAndFooterDOM();
            applyAspectRatioLayout();
            const options = buildChartOptions(animate);
            currentChartSignature = getChartSignature();

            if (chart) {
                chart.destroy();
                chart = null;
            }
            const container = document.querySelector('#mainChart');
            container.innerHTML = '';
            chart = new ApexCharts(container, options);
            chart.render();
        }

        function scheduleCleanRerender(delay = 120) {
            clearTimeout(resizeRenderTimer);
            resizeRenderTimer = setTimeout(() => {
                renderChart(false);
            }, delay);
        }

        function updateUI(forceRecreate = false) {
            updateHeaderAndFooterDOM();
            saveStateToStorage();

            if (!chart) return;

            const sig = getChartSignature();
            if (forceRecreate || sig !== currentChartSignature) {
                renderChart(true);
            } else {
                chart.updateOptions(buildChartOptions(true), true, true);
            }
        }

        /* --- Plein écran --- */
        function toggleFullscreen() {
            const el = document.getElementById('captureArea');
            if (!getFullscreenElement()) {
                const req = el.requestFullscreen || el.webkitRequestFullscreen;
                if (req) {
                    Promise.resolve(req.call(el)).catch(err => console.warn('Plein écran impossible', err));
                }
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) exit.call(document);
            }
        }

        function handleFullscreenChange() {
            const btn = document.getElementById('fullscreenBtn');
            const captureArea = document.getElementById('captureArea');
            const isFs = Boolean(getFullscreenElement());

            captureArea.classList.toggle('is-fullscreen', isFs);
            btn.classList.toggle('fullscreen-active', isFs);
            btn.innerHTML = `<i data-lucide="${isFs ? 'minimize' : 'maximize'}"></i>`;
            lucide.createIcons();

            scheduleCleanRerender(120);
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        window.addEventListener('resize', () => {
            if (getFullscreenElement() || state.aspectRatio !== 'auto') {
                scheduleCleanRerender(140);
            }
        });

        /* --- Menu Export Multi-formats --- */
        function toggleExportMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('exportMenu');
            menu.classList.toggle('open');
        }

        function closeExportMenu() {
            document.getElementById('exportMenu').classList.remove('open');
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('exportDropdown');
            if (dropdown && !dropdown.contains(e.target)) closeExportMenu();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeExportMenu();
        });

        function getBaseFileName() {
            const cleanTitle = state.title.trim().replace(/[^a-zA-Z0-9À-ÿ_-]+/g, '-').replace(/^-+|-+$/g, '');
            return cleanTitle ? `Plot-${cleanTitle}` : 'Plot-Graphique';
        }

        function captureChartCanvas(forceOpaque = false) {
            const element = document.getElementById('captureArea');
            const useTransparent = state.transparentBg && !forceOpaque;
            const bgColor = useTransparent ? null : (isDarkMode ? '#121216' : '#ffffff');
            return html2canvas(element, {
                scale: 4,
                backgroundColor: bgColor,
                useCORS: true,
                logging: false
            });
        }

        async function copyImageHD() {
            const btn = document.getElementById('copyImgBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader" class="spin"></i> Copie...';
            btn.disabled = true;
            lucide.createIcons();

            try {
                if (!navigator.clipboard || typeof ClipboardItem === 'undefined') {
                    throw new Error('ClipboardItem indisponible');
                }

                const blobPromise = captureChartCanvas(false).then(canvas =>
                    new Promise((resolve, reject) => {
                        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Blob PNG échoué')), 'image/png');
                    })
                );

                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blobPromise })
                ]);

                btn.innerHTML = '<i data-lucide="check"></i> Copié';
                lucide.createIcons();
                showToast(state.transparentBg ? 'Image PNG transparente HD copiée !' : 'Image HD copiée dans le presse-papier !');

                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                    lucide.createIcons();
                }, 1600);
            } catch (err) {
                console.warn('Copie presse-papier impossible:', err);
                showToast('Copie bloquée par le navigateur (utilisez Exporter)', true);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        function buildStandaloneSVG() {
            const svgEl = document.querySelector('#mainChart svg.apexcharts-svg');
            if (!svgEl) throw new Error('SVG introuvable');

            const rect = svgEl.getBoundingClientRect();
            const chartW = Math.ceil(Number(svgEl.getAttribute('width')) || rect.width || 760);
            const chartH = Math.ceil(Number(svgEl.getAttribute('height')) || rect.height || 420);

            const padX = 40;
            const hasTitle = state.title.trim() !== '';
            const hasAvgBadge = document.getElementById('avgBadge').style.display !== 'none';
            const topPad = 36 + (hasTitle ? 46 : 0) + (hasAvgBadge ? 30 : 0);
            const bottomPad = 48;

            const totalW = chartW + padX * 2;
            const totalH = chartH + topPad + bottomPad;

            const bgColor = isDarkMode ? '#121216' : '#ffffff';
            const titleColor = isDarkMode ? '#f4f4f5' : '#18181b';
            const mutedColor = isDarkMode ? '#a1a1aa' : '#71717a';

            const NS = 'http://www.w3.org/2000/svg';
            const outer = document.createElementNS(NS, 'svg');
            outer.setAttribute('xmlns', NS);
            outer.setAttribute('width', String(totalW));
            outer.setAttribute('height', String(totalH));
            outer.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
            outer.style.fontFamily = 'Inter, -apple-system, BlinkMacSystemFont, sans-serif';

            if (!state.transparentBg) {
                const bg = document.createElementNS(NS, 'rect');
                bg.setAttribute('width', String(totalW));
                bg.setAttribute('height', String(totalH));
                bg.setAttribute('rx', '24');
                bg.setAttribute('fill', bgColor);
                outer.appendChild(bg);
            }

            if (hasTitle) {
                const titleNode = document.createElementNS(NS, 'text');
                titleNode.setAttribute('x', String(totalW / 2));
                titleNode.setAttribute('y', '52');
                titleNode.setAttribute('text-anchor', 'middle');
                titleNode.setAttribute('fill', titleColor);
                titleNode.setAttribute('font-size', '22');
                titleNode.setAttribute('font-weight', '700');
                titleNode.setAttribute('font-family', 'Inter, -apple-system, sans-serif');
                titleNode.textContent = state.title.trim();
                outer.appendChild(titleNode);
            }

            if (hasAvgBadge) {
                const avgNode = document.createElementNS(NS, 'text');
                avgNode.setAttribute('x', String(totalW / 2));
                avgNode.setAttribute('y', hasTitle ? '82' : '50');
                avgNode.setAttribute('text-anchor', 'middle');
                avgNode.setAttribute('fill', isDarkMode ? '#38bdf8' : '#0284c7');
                avgNode.setAttribute('font-size', '13');
                avgNode.setAttribute('font-weight', '600');
                avgNode.setAttribute('font-family', 'Inter, -apple-system, sans-serif');
                avgNode.textContent = document.getElementById('avgBadge').textContent;
                outer.appendChild(avgNode);
            }

            const cloned = svgEl.cloneNode(true);
            cloned.setAttribute('x', String(padX));
            cloned.setAttribute('y', String(topPad));
            cloned.setAttribute('width', String(chartW));
            cloned.setAttribute('height', String(chartH));
            outer.appendChild(cloned);

            if (state.source.trim() !== '') {
                const srcNode = document.createElementNS(NS, 'text');
                srcNode.setAttribute('x', '24');
                srcNode.setAttribute('y', String(totalH - 18));
                srcNode.setAttribute('fill', mutedColor);
                srcNode.setAttribute('font-size', '12');
                srcNode.setAttribute('font-weight', '500');
                srcNode.setAttribute('font-family', 'Inter, -apple-system, sans-serif');
                srcNode.textContent = state.source.trim();
                outer.appendChild(srcNode);
            }

            const brandNode = document.createElementNS(NS, 'text');
            brandNode.setAttribute('x', String(totalW - 24));
            brandNode.setAttribute('y', String(totalH - 18));
            brandNode.setAttribute('text-anchor', 'end');
            brandNode.setAttribute('fill', mutedColor);
            brandNode.setAttribute('font-size', '11');
            brandNode.setAttribute('font-weight', '700');
            brandNode.setAttribute('font-family', 'Inter, -apple-system, sans-serif');
            brandNode.textContent = 'MADE WITH PLOT';
            outer.appendChild(brandNode);

            return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(outer);
        }

        function exportCSV() {
            const visibleRows = state.rows.filter(r => !r.hidden && r.label.trim() !== '');
            const isCirc = isCircularType(state.chartType);
            const activeSeries = isCirc ? [state.series[0]] : state.series;

            const escapeCell = (val) => {
                const str = String(val ?? '');
                return /[",;\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
            };

            const header = ['Catégorie', ...activeSeries.map(s => s.name || 'Valeur')].map(escapeCell).join(',');
            const lines = visibleRows.map(r => [
                r.label,
                ...activeSeries.map((_, idx) => Number(r.values[idx]) || 0)
            ].map(escapeCell).join(','));

            const csvContent = '\uFEFF' + [header, ...lines].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            triggerBlobDownload(blob, `${getBaseFileName()}.csv`);
        }

        function triggerBlobDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function exportFile(format) {
            closeExportMenu();

            const btn = document.getElementById('downloadBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader" class="spin"></i> Export...';
            btn.disabled = true;
            lucide.createIcons();

            try {
                const baseName = getBaseFileName();

                if (format === 'csv') {
                    exportCSV();
                    showToast('Données CSV exportées !');
                } else if (format === 'svg') {
                    const svgString = buildStandaloneSVG();
                    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                    triggerBlobDownload(blob, `${baseName}.svg`);
                    showToast('Fichier vectoriel SVG exporté !');
                } else if (format === 'pdf') {
                    const canvas = await captureChartCanvas(true);
                    const { jsPDF } = window.jspdf;
                    const pdfW = Math.round(canvas.width / 2);
                    const pdfH = Math.round(canvas.height / 2);
                    const orientation = pdfW >= pdfH ? 'landscape' : 'portrait';
                    const pdf = new jsPDF({ orientation, unit: 'px', format: [pdfW, pdfH] });
                    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdfW, pdfH);
                    pdf.save(`${baseName}.pdf`);
                    showToast('Document PDF HD exporté !');
                } else if (format === 'jpeg') {
                    const canvas = await captureChartCanvas(true);
                    const link = document.createElement('a');
                    link.download = `${baseName}.jpeg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    showToast('Image JPEG HD exportée !');
                } else if (format === 'webp') {
                    const canvas = await captureChartCanvas(false);
                    const link = document.createElement('a');
                    link.download = `${baseName}.webp`;
                    link.href = canvas.toDataURL('image/webp', 0.95);
                    link.click();
                    showToast('Image WebP HD exportée !');
                } else {
                    const canvas = await captureChartCanvas(false);
                    const link = document.createElement('a');
                    link.download = `${baseName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('Image PNG HD exportée !');
                }
            } catch (err) {
                console.error(err);
                showToast(`Erreur lors de l'export ${format.toUpperCase()}`, true);
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        /* --- Lien de partage éditable sans backend --- */
        async function copyShareLink() {
            const btn = document.getElementById('shareBtn');
            const originalHTML = btn.innerHTML;

            try {
                const encoded = encodeStateToHash(state);
                const shareUrl = `${window.location.href.split('#')[0]}#data=${encoded}`;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(shareUrl);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = shareUrl;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }

                btn.innerHTML = '<i data-lucide="check"></i>';
                lucide.createIcons();
                showToast('Lien éditable copié dans le presse-papier !');

                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    lucide.createIcons();
                }, 1600);
            } catch (err) {
                console.error(err);
                showToast('Impossible de copier le lien', true);
            }
        }

        /* --- Initialisation --- */
        function init() {
            initTheme();
            loadInitialState();
            syncControlsFromState();
            renderRatios();
            renderPalettes();
            renderSeriesList();
            renderDataList();
            lucide.createIcons();
            renderChart(true);
        }

        init();
    </script>
</body>
